name: Team Strength Tests

on:
  push:
    paths:
      - 'src/services/teamStrength/**'
      - 'src/components/matches/MatchPredictionCard.*'
      - 'src/app/matches/[id]/page.tsx'
      - 'src/app/api/cron/team-strength-predictions/**'
      - 'src/domain/story-engine/ClashVenue.ts'
      - 'src/domain/story-engine/ClashVenue.test.ts'
      - 'supabase/migrations/20260901210500_add_team_strength_prediction_snapshots.sql'
      - 'package.json'
      - '.github/workflows/team-strength.yml'
  pull_request:
    paths:
      - 'src/services/teamStrength/**'
      - 'src/components/matches/MatchPredictionCard.*'
      - 'src/app/matches/[id]/page.tsx'
      - 'src/app/api/cron/team-strength-predictions/**'
      - 'src/domain/story-engine/ClashVenue.ts'
      - 'src/domain/story-engine/ClashVenue.test.ts'
      - 'supabase/migrations/20260901210500_add_team_strength_prediction_snapshots.sql'
      - 'package.json'
      - '.github/workflows/team-strength.yml'

permissions:
  contents: read

jobs:
  test-team-strength:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Team Strength tests
        run: npm run test:team-strength
