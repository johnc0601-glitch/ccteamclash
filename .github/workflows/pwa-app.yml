name: PWA App Tests

on:
  push:
    paths:
      - 'src/components/AppBottomNav.*'
      - 'src/components/PwaLifecycle.*'
      - 'src/components/PwaHomeDashboard.*'
      - 'src/components/appShellState*'
      - 'src/components/appPreviewState*'
      - 'src/components/account/PwaMeHub.*'
      - 'src/components/matches/PwaMatchdayHub.*'
      - 'src/components/matches/PwaMatchdayPhase*'
      - 'src/components/teams/PwaTeamHub.*'
      - 'src/app/manifest.ts'
      - 'public/sw.js'
      - 'package.json'
      - '.github/workflows/pwa-app.yml'
  pull_request:
    paths:
      - 'src/components/AppBottomNav.*'
      - 'src/components/PwaLifecycle.*'
      - 'src/components/PwaHomeDashboard.*'
      - 'src/components/appShellState*'
      - 'src/components/appPreviewState*'
      - 'src/components/account/PwaMeHub.*'
      - 'src/components/matches/PwaMatchdayHub.*'
      - 'src/components/matches/PwaMatchdayPhase*'
      - 'src/components/teams/PwaTeamHub.*'
      - 'src/app/manifest.ts'
      - 'public/sw.js'
      - 'package.json'
      - '.github/workflows/pwa-app.yml'

permissions:
  contents: read

jobs:
  test-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run PWA app tests
        run: npm run test:pwa
